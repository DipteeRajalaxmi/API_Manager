server:
  port: 8081

spring:
  application:
    name: identity-service

  datasource:
    url:               jdbc:postgresql://localhost:5432/apimanager
    username:          postgres
    password:          postgres123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto:        validate
    show-sql:          true
    properties:
      hibernate:
        dialect:       org.hibernate.dialect.PostgreSQLDialect
        format_sql:    true

  flyway:
    enabled:             true
    locations:           classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info