server:
  port: 8080

spring:
  application:
    name: api-manager
  datasource:
    url: jdbc:postgresql://localhost:5432/apimanager
    username: postgres
    password: api_manager
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: a8f3d2e1b9c7f4a6e2d8b3c1f7e9a4d2b6c8e3f1a7d4b9c2e6f8a3d1b7c4e9
  expiration: 86400000
  refresh-expiration: 604800000